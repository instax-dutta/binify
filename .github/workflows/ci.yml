name: CI

# Runs on every pull request and on pushes to main. The integration suite needs
# a real PostgreSQL instance, because the properties it asserts — exactly-once
# burn-after-read, atomic rate limiting — only hold under genuine row locking and
# cannot be proven against a mock.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: binify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/binify_test
      DATABASE_SSL: "false"
      TOKEN_PEPPER: ci-pepper-not-a-secret
      TRUST_PROXY: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers for the cross-browser and accessibility gates
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint the completion ledger
        run: npx unlazy-lint || true

      - name: Type check
        run: node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Apply schema to the test database
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Static gates (headers, crawler policy, CI definition, assets, budgets)
        run: |
          node scripts/verify-headers.mjs
          node scripts/verify-crawler.mjs
          node scripts/verify-ci.mjs
          node scripts/verify-assets.mjs
          node scripts/verify-budget.mjs

      - name: Runtime gates in a real browser
        run: |
          node scripts/verify-csp-not-blocking.mjs
          node scripts/verify-pending-ui.mjs
          node scripts/verify-a11y.mjs
          node scripts/verify-browsers.mjs

      - name: Error boundary gate
        run: node scripts/verify-error-boundary.mjs